services:
  mongo:
    image: mongo:7
    container_name: tetouandrive-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  backend:
    build: ./backend
    container_name: tetouandrive-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/tetouandrive
    depends_on:
      - mongo
    ports:
      - "5000:5000"

volumes:
  mongo_data:
